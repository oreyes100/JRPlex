# VPS .250: dedicated JRPlex vhost. The certificate is generated on this VPS;
# its PUBLIC certificate is pinned on the edge. The private key stays here.
server {
    listen 80;
    listen [::]:80;
    server_name jrplexps.duckdns.org;
    access_log off;
    return 301 https://jrplexps.duckdns.org$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jrplexps.duckdns.org;
    ssl_certificate /etc/nginx/ssl/jrplexps.duckdns.org/backend.crt;
    ssl_certificate_key /etc/nginx/ssl/jrplexps.duckdns.org/backend.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/jrplex-error.log warn;
    client_max_body_size 2m;
    location / {
        allow 192.168.1.34;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Only the allowed edge can supply the client address; never accept public XFF.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }
}
