# Edge .34, pending explicit host authorization. Do not enable before:
# 1) the .250 backend is healthy and its public certificate is installed here;
# 2) ACME HTTP-01 succeeds and the public certificate files below exist;
# 3) nginx -t succeeds. Never disable backend certificate verification.
server {
    listen 80;
    listen [::]:80;
    server_name jrplexps.duckdns.org;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://jrplexps.duckdns.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jrplexps.duckdns.org;
    ssl_certificate /etc/nginx/ssl/jrplexps.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/jrplexps.duckdns.org/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    error_log /var/log/nginx/jrplex-error.log warn;
    location / {
        proxy_pass https://192.168.1.250:443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name jrplexps.duckdns.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/ssl/jrplexps.duckdns.org/backend.crt;
        proxy_set_header Host jrplexps.duckdns.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }
}
